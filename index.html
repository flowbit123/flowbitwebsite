    <!-- Structured Data: Business -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Flowbit",
      "url": "https://flowbit.co.za",
      "email": "charl@flowbit.co.za",
      "description": "Flowbit builds custom WhatsApp automation, AI receptionists, lead qualification bots, and booking automation systems for small and medium businesses. Every lead gets an instant response, 24 hours a day, 7 days a week.",
      "slogan": "Never Miss a Lead Again",
      "areaServed": "Worldwide",
      "knowsLanguage": ["English", "Afrikaans"],
      "serviceType": [
        "WhatsApp Automation",
        "AI Receptionist",
        "Lead Qualification Bot",
        "Booking Automation",
        "Outbound Sales Automation",
        "Business Process Automation"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Automation Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Lead Qualification Bot",
              "description": "An automated bot that instantly replies to every enquiry, asks qualifying questions, and sends you a summary of serious leads so you only spend time on buyers who are ready to commit."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Booking Automation",
              "description": "Clients message you, get an instant reply, and walk away with a confirmed booking — all without you lifting a finger. Integrates with Google Calendar for real-time availability."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Outbound Sales Agent",
              "description": "An AI agent that proactively reaches out to leads, follows up on unpaid quotes, and re-engages cold prospects so no potential client falls through the cracks."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Full AI Receptionist",
              "description": "A Claude-powered AI that handles the full client journey across WhatsApp, Instagram, and website chat simultaneously — in English and Afrikaans, 24 hours a day."
            }
          }
        ]
      }
    }
    </script>

    <!-- Structured Data: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What exactly is a custom automation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A custom automation is code we build specifically for your business that handles a repetitive task without any human involvement. Unlike off the shelf tools like Zapier (which just connect apps), we write the actual logic, intelligence, and workflows tailored to how your business operates. The result feels purpose built, because it is."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take to build and go live?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most automations are live within 5 to 10 business days after our discovery call. Simpler flows like a WhatsApp lead capture can be done in 2 to 3 days. More complex systems with AI integration and multiple tool connections typically take 1 to 2 weeks."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to be technical to work with Flowbit?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Not at all. You just need to know your business and its pain points. We handle all the technical implementation. You will never need to look at a line of code. We explain everything in plain language and train your team on how to use the system we build."
          }
        },
        {
          "@type": "Question",
          "name": "Do you use AI or preprogrammed logic?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Both, and we help you choose the right approach. Preprogrammed logic is faster, cheaper, and more predictable (great for structured workflows like bookings or FAQs). AI integration using the Claude API is better when you need natural, dynamic conversations that handle anything a customer might say. Many clients use a combination of both."
          }
        },
        {
          "@type": "Question",
          "name": "What if I want changes after the automation is live?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your monthly retainer includes ongoing support and iterations. As your business evolves, we update your automations. Minor tweaks are handled within 24 to 48 hours. Larger feature additions are scoped and priced transparently before we build."
          }
        }
      ]
    }
    </script>

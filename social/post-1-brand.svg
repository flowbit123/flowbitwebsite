<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">

  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="#0D1E2A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <radialGradient id="orb-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7BAFC4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7BAFC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7BAFC4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7BAFC4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="6"  result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-lg">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg-glow)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="54" height="54" patternUnits="userSpaceOnUse">
    <circle cx="27" cy="27" r="1" fill="rgba(255,255,255,0.06)"/>
  </pattern>
  <rect width="1080" height="1080" fill="url(#dots)"/>

  <!-- Large ambient halo behind logo -->
  <circle cx="540" cy="460" r="420" fill="url(#orb-halo)"/>

  <!-- ── NEURAL LOGO MARK (large, centered) ── -->
  <!-- Outer halo -->
  <circle cx="540" cy="430" r="310" fill="url(#orb-halo)" opacity="0.6"/>

  <!-- Dashed orbit ring -->
  <circle cx="540" cy="430" r="244" stroke="#7BAFC4" stroke-width="1.2" stroke-opacity="0.18" fill="none" stroke-dasharray="8 14"/>

  <!-- Connection lines -->
  <path d="M540 430 Q508 320 540 200" stroke="#7BAFC4" stroke-width="2.2" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
  <path d="M540 430 Q402 472 354 590" stroke="#7BAFC4" stroke-width="2.2" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
  <path d="M540 430 Q678 472 726 590" stroke="#7BAFC4" stroke-width="2.2" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>

  <!-- Triangle arcs -->
  <path d="M540 200 Q272 394 354 590" stroke="#7BAFC4" stroke-width="1.4" stroke-opacity="0.22" fill="none"/>
  <path d="M540 200 Q808 394 726 590" stroke="#7BAFC4" stroke-width="1.4" stroke-opacity="0.22" fill="none"/>
  <path d="M354 590 Q540 668 726 590" stroke="#7BAFC4" stroke-width="1.4" stroke-opacity="0.22" fill="none"/>

  <!-- Node glows -->
  <circle cx="540" cy="200" r="62" fill="url(#node-g)"/>
  <circle cx="354" cy="590" r="62" fill="url(#node-g)"/>
  <circle cx="726" cy="590" r="62" fill="url(#node-g)"/>

  <!-- Central glow -->
  <circle cx="540" cy="430" r="96" fill="#7BAFC4" fill-opacity="0.1"/>

  <!-- Outer nodes -->
  <circle cx="540" cy="200" r="30" fill="#7BAFC4" filter="url(#glow-sm)"/>
  <circle cx="354" cy="590" r="30" fill="#7BAFC4" filter="url(#glow-sm)"/>
  <circle cx="726" cy="590" r="30" fill="#7BAFC4" filter="url(#glow-sm)"/>

  <!-- Central node -->
  <circle cx="540" cy="430" r="54" fill="#7BAFC4" filter="url(#glow-lg)"/>
  <circle cx="540" cy="430" r="28" fill="#ffffff"/>

  <!-- ── WORDMARK — glowing, centered ── -->
  <!-- FLOW bloom layer -->
  <text x="540" y="800" text-anchor="middle"
    font-family="'Inter','Arial Black','Helvetica Neue',Arial,sans-serif"
    font-size="148" font-weight="900" letter-spacing="-5"
    fill="rgba(255,255,255,0.45)" filter="url(#glow-lg)">FLOWBIT</text>
  <!-- FLOW solid -->
  <text x="266" y="800"
    font-family="'Inter','Arial Black','Helvetica Neue',Arial,sans-serif"
    font-size="148" font-weight="900" letter-spacing="-5"
    fill="#ffffff">FLOW</text>
  <!-- BIT bloom -->
  <text x="700" y="800"
    font-family="'Inter','Arial Black','Helvetica Neue',Arial,sans-serif"
    font-size="148" font-weight="900" letter-spacing="-5"
    fill="rgba(123,175,196,0.35)" filter="url(#glow-lg)">BIT</text>
  <!-- BIT solid -->
  <text x="700" y="800"
    font-family="'Inter','Arial Black','Helvetica Neue',Arial,sans-serif"
    font-size="148" font-weight="900" letter-spacing="-5"
    fill="#7BAFC4">BIT</text>

  <!-- Tagline -->
  <text x="540" y="840"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="24" font-weight="400" letter-spacing="8"
    fill="rgba(255,255,255,0.45)" text-anchor="middle">AI AUTOMATION AGENCY</text>

  <!-- Divider -->
  <line x1="340" y1="870" x2="740" y2="870" stroke="rgba(123,175,196,0.3)" stroke-width="1"/>

  <!-- Handle -->
  <text x="540" y="920"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="22" font-weight="500" letter-spacing="3"
    fill="rgba(255,255,255,0.35)" text-anchor="middle">@flowbit.co</text>

  <!-- Corner accents -->
  <path d="M60 60 L60 110 M60 60 L110 60" stroke="rgba(123,175,196,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M1020 60 L1020 110 M1020 60 L970 60" stroke="rgba(123,175,196,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M60 1020 L60 970 M60 1020 L110 1020" stroke="rgba(123,175,196,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M1020 1020 L1020 970 M1020 1020 L970 1020" stroke="rgba(123,175,196,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">

  <!-- Dark background -->
  <rect width="512" height="512" rx="120" fill="#0A0A0A"/>

  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7BAFC4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7BAFC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7BAFC4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7BAFC4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer halo -->
  <circle cx="256" cy="256" r="210" fill="url(#halo)"/>

  <!-- Faint ring -->
  <circle cx="256" cy="256" r="168" stroke="#7BAFC4" stroke-width="1" stroke-opacity="0.12" fill="none" stroke-dasharray="6 10"/>

  <!-- Connection lines (center to nodes) -->
  <path d="M256 256 Q232 168 256 88"  stroke="#7BAFC4" stroke-width="2.2" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
  <path d="M256 256 Q156 286 112 368" stroke="#7BAFC4" stroke-width="2.2" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
  <path d="M256 256 Q356 286 400 368" stroke="#7BAFC4" stroke-width="2.2" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>

  <!-- Triangle arcs (outer nodes to each other) -->
  <path d="M256 88 Q76 230 112 368"  stroke="#7BAFC4" stroke-width="1.4" stroke-opacity="0.3" fill="none"/>
  <path d="M256 88 Q436 230 400 368" stroke="#7BAFC4" stroke-width="1.4" stroke-opacity="0.3" fill="none"/>
  <path d="M112 368 Q256 440 400 368" stroke="#7BAFC4" stroke-width="1.4" stroke-opacity="0.3" fill="none"/>

  <!-- Outer node glows -->
  <circle cx="256" cy="88"  r="44" fill="url(#node-glow)"/>
  <circle cx="112" cy="368" r="44" fill="url(#node-glow)"/>
  <circle cx="400" cy="368" r="44" fill="url(#node-glow)"/>

  <!-- Central node glow -->
  <circle cx="256" cy="256" r="68" fill="#7BAFC4" fill-opacity="0.12"/>

  <!-- Outer nodes -->
  <circle cx="256" cy="88"  r="22" fill="#7BAFC4" filter="url(#glow)"/>
  <circle cx="112" cy="368" r="22" fill="#7BAFC4" filter="url(#glow)"/>
  <circle cx="400" cy="368" r="22" fill="#7BAFC4" filter="url(#glow)"/>

  <!-- Central node -->
  <circle cx="256" cy="256" r="40" fill="#7BAFC4" filter="url(#glow-strong)"/>
  <circle cx="256" cy="256" r="20" fill="#ffffff"/>

</svg>

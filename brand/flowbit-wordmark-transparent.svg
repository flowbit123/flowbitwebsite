<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <filter id="flow-bloom" x="-15%" y="-50%" width="130%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
    </filter>
    <filter id="bit-bloom" x="-15%" y="-50%" width="130%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
    </filter>
  </defs>

  <!-- FLOW bloom -->
  <text x="52" y="238"
    font-family="'Inter','Arial Black','Helvetica Neue',Arial,sans-serif"
    font-size="210" font-weight="900" letter-spacing="-6"
    fill="rgba(255,255,255,0.5)"
    filter="url(#flow-bloom)">FLOW</text>

  <!-- FLOW solid -->
  <text x="52" y="238"
    font-family="'Inter','Arial Black','Helvetica Neue',Arial,sans-serif"
    font-size="210" font-weight="900" letter-spacing="-6"
    fill="#ffffff">FLOW</text>

  <!-- BIT bloom -->
  <text x="628" y="238"
    font-family="'Inter','Arial Black','Helvetica Neue',Arial,sans-serif"
    font-size="210" font-weight="900" letter-spacing="-6"
    fill="rgba(123,175,196,0.35)"
    filter="url(#bit-bloom)">BIT</text>

  <!-- BIT solid -->
  <text x="628" y="238"
    font-family="'Inter','Arial Black','Helvetica Neue',Arial,sans-serif"
    font-size="210" font-weight="900" letter-spacing="-6"
    fill="#7BAFC4">BIT</text>

</svg>

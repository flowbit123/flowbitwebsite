<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none">

  <!-- Dark background -->
  <rect width="1200" height="400" rx="0" fill="#0A0A0A"/>

  <defs>
    <radialGradient id="halo-h" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7BAFC4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7BAFC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node-glow-h" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7BAFC4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7BAFC4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-h" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong-h" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Subtle background glow behind logo area -->
    <radialGradient id="bg-glow" cx="30%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#7BAFC4" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#7BAFC4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background ambient -->
  <rect width="1200" height="400" fill="url(#bg-glow)"/>

  <!-- ═══ ICON (centered at 200, 200) ═══ -->

  <!-- Outer halo -->
  <circle cx="200" cy="200" r="140" fill="url(#halo-h)"/>

  <!-- Faint dashed ring -->
  <circle cx="200" cy="200" r="112" stroke="#7BAFC4" stroke-width="1" stroke-opacity="0.14" fill="none" stroke-dasharray="5 9"/>

  <!-- Spoke lines (center to nodes) -->
  <path d="M200 200 Q182 146 200 86"  stroke="#7BAFC4" stroke-width="2" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
  <path d="M200 200 Q138 218 116 278" stroke="#7BAFC4" stroke-width="2" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
  <path d="M200 200 Q262 218 284 278" stroke="#7BAFC4" stroke-width="2" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>

  <!-- Triangle arcs -->
  <path d="M200 86 Q80 188 116 278"  stroke="#7BAFC4" stroke-width="1.2" stroke-opacity="0.28" fill="none"/>
  <path d="M200 86 Q320 188 284 278" stroke="#7BAFC4" stroke-width="1.2" stroke-opacity="0.28" fill="none"/>
  <path d="M116 278 Q200 316 284 278" stroke="#7BAFC4" stroke-width="1.2" stroke-opacity="0.28" fill="none"/>

  <!-- Node glows -->
  <circle cx="200" cy="86"  r="30" fill="url(#node-glow-h)"/>
  <circle cx="116" cy="278" r="30" fill="url(#node-glow-h)"/>
  <circle cx="284" cy="278" r="30" fill="url(#node-glow-h)"/>
  <circle cx="200" cy="200" r="46" fill="#7BAFC4" fill-opacity="0.1"/>

  <!-- Outer nodes -->
  <circle cx="200" cy="86"  r="16" fill="#7BAFC4" filter="url(#glow-h)"/>
  <circle cx="116" cy="278" r="16" fill="#7BAFC4" filter="url(#glow-h)"/>
  <circle cx="284" cy="278" r="16" fill="#7BAFC4" filter="url(#glow-h)"/>

  <!-- Central node -->
  <circle cx="200" cy="200" r="28" fill="#7BAFC4" filter="url(#glow-strong-h)"/>
  <circle cx="200" cy="200" r="14" fill="#ffffff"/>

  <!-- ═══ WORDMARK ═══ -->
  <text
    x="370" y="232"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="108"
    font-weight="800"
    letter-spacing="-3"
    fill="#ffffff"
  >FLOW</text>
  <text
    x="730" y="232"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="108"
    font-weight="800"
    letter-spacing="-3"
    fill="#7BAFC4"
  >BIT</text>

  <!-- Tagline -->
  <text
    x="372" y="278"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    font-weight="400"
    letter-spacing="5"
    fill="#6B7280"
  >AUTOMATE EVERYTHING</text>

</svg>

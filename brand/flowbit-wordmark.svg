<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <radialGradient id="bg" cx="38%" cy="50%" r="65%">
      <stop offset="0%"   stop-color="#111B22"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <!-- Glow ellipse behind FLOW only -->
    <radialGradient id="flow-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Bloom glow behind FLOW only — contained ellipse, cannot bleed into BIT -->
  <ellipse cx="310" cy="148" rx="290" ry="148" fill="url(#flow-glow)" filter="url(#blur-glow)"/>

  <!-- Single text element — split colors via tspan, zero overlap possible -->
  <text x="48" y="242"
    font-family="'Inter','Arial Black','Helvetica Neue',Arial,sans-serif"
    font-size="210" font-weight="900" letter-spacing="-6">
    <tspan fill="#ffffff">FLOW</tspan><tspan fill="#7BAFC4">BIT</tspan>
  </text>

</svg>
